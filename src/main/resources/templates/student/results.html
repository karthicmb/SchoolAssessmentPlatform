<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result History - School Assessment Platform</title>
    <link th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/student/dashboard}">
                <i class="bi bi-mortarboard-fill me-2"></i>School Assessment Platform
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white small">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="${username}">student</span>
                    <span class="badge bg-info text-dark ms-1">Student</span>
                </span>
                <form th:action="@{/logout}" method="post" class="mb-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="bg-white border-bottom py-3">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item">
                        <a th:href="@{/student/dashboard}" class="text-decoration-none">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item active">Result History</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="container py-4 flex-grow-1">

        <h4 class="fw-bold text-primary mb-4">
            <i class="bi bi-clock-history me-2"></i>Result History
        </h4>

        <!-- Empty state -->
        <div th:if="${results.isEmpty()}" class="card border-0 shadow-sm">
            <div class="card-body text-center py-5">
                <i class="bi bi-inbox text-muted" style="font-size:3rem;"></i>
                <h5 class="mt-3 text-muted">No results yet</h5>
                <p class="text-muted small mb-3">Complete an exam to see your results here.</p>
                <a th:href="@{/student/exams}" class="btn btn-primary btn-sm">
                    <i class="bi bi-journal-text me-1"></i>View Exams
                </a>
            </div>
        </div>

        <!-- Results list -->
        <div th:unless="${results.isEmpty()}" class="row g-3">
            <div class="col-12" th:each="result : ${results}">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="row align-items-center g-3">

                            <!-- Grade badge -->
                            <div class="col-auto text-center" style="min-width:70px;">
                                <div class="fw-bold fs-3"
                                     th:classappend="${result.grade == 'A+' or result.grade == 'A'} ? 'text-success'
                                                    : (${result.grade == 'B'} ? 'text-primary'
                                                    : (${result.grade == 'F'} ? 'text-danger' : 'text-warning'))"
                                     th:text="${result.grade}">A+</div>
                                <div class="text-muted small" th:text="${result.percentage} + '%'">0%</div>
                            </div>

                            <!-- Exam info -->
                            <div class="col">
                                <div class="fw-semibold" th:text="${result.examTitle}">Exam Title</div>
                                <div class="text-muted small"
                                     th:text="${result.subject} + ' &bull; Class ' + ${result.studentClass}">
                                    Subject • Class
                                </div>
                                <div class="text-muted small mt-1">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    <span th:text="${result.submittedAt}">-</span>
                                </div>
                            </div>

                            <!-- Score stats -->
                            <div class="col-auto d-none d-md-flex gap-3 text-center">
                                <div>
                                    <div class="fw-bold text-success" th:text="${result.correct}">0</div>
                                    <div class="text-muted" style="font-size:0.7rem;">Correct</div>
                                </div>
                                <div>
                                    <div class="fw-bold text-danger" th:text="${result.wrong}">0</div>
                                    <div class="text-muted" style="font-size:0.7rem;">Wrong</div>
                                </div>
                                <div>
                                    <div class="fw-bold text-secondary" th:text="${result.skipped}">0</div>
                                    <div class="text-muted" style="font-size:0.7rem;">Skipped</div>
                                </div>
                                <div>
                                    <div class="fw-bold" th:text="${result.totalQuestions}">0</div>
                                    <div class="text-muted" style="font-size:0.7rem;">Total</div>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="col-auto d-flex gap-2">
                                <a th:href="@{/student/result/{rid}(rid=${result.resultId})}"
                                   class="btn btn-outline-primary btn-sm">
                                    <i class="bi bi-eye me-1"></i>Result
                                </a>
                                <a th:href="@{/student/exam/{eid}/review/{rid}(eid=${result.examId}, rid=${result.resultId})}"
                                   class="btn btn-outline-secondary btn-sm">
                                    <i class="bi bi-list-check me-1"></i>Review
                                </a>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container text-center text-muted small">
            &copy; 2026 School Assessment Platform
        </div>
    </footer>

    <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
