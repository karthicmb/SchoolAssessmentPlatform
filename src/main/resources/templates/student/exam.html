<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${exam.title} + ' - Exam'">Exam</title>
    <link th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <style>
        .question-card {
            border-left: 5px solid #0d6efd;
            border-radius: 1.25rem !important;
        }
        .question-text {
            font-size: 1.625rem;
            font-weight: 600;
            line-height: 1.4;
            color: #1a1a2e;
        }
        .option-card {
            cursor: pointer;
            display: block;
            height: 100%;
            margin: 0;
        }
        .option-card-inner {
            border: 2px solid #dee2e6;
            border-radius: 1rem;
            font-size: 1.25rem;
            line-height: 1.35;
            background: #ffffff;
            min-height: 90px;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: border-color 0.12s ease, background-color 0.12s ease;
            height: 100%;
        }
        .option-card:hover .option-card-inner {
            border-color: #0d6efd;
            background-color: #f0f4ff;
        }
        .option-card.selected .option-card-inner {
            border-color: #0d6efd;
            background-color: #e8f0fe;
        }
        .option-badge {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.875rem;
            flex-shrink: 0;
            transition: background-color 0.12s ease, color 0.12s ease;
        }
        .option-card.selected .option-badge {
            background: #0d6efd;
            color: white;
        }
        .palette-btn {
            width: 44px;
            height: 44px;
            font-size: 0.875rem;
            padding: 0;
            border-radius: 0.5rem;
        }
        .exam-progress {
            height: 8px;
            border-radius: 0;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary shadow-sm py-3">
        <div class="container-fluid px-4">
            <span class="navbar-brand fw-bold fs-5 text-truncate" style="max-width:45%;"
                  th:text="${exam.title}">Exam Title</span>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white">
                    <i class="bi bi-check-circle me-1"></i>
                    <span id="answeredCountDisplay" th:text="${answeredCount}">0</span>
                    <span class="opacity-75">/ <span th:text="${totalQuestions}">0</span></span>
                </span>
                <span th:if="${timerEnabled}" class="badge bg-warning text-dark fs-6 px-3 py-2" id="timerDisplay">
                    <i class="bi bi-stopwatch me-1"></i>
                    <span id="timerText">--:--</span>
                </span>
                <span th:unless="${timerEnabled}" class="badge bg-secondary py-2">No Timer</span>
            </div>
        </div>
    </nav>

    <!-- Progress Bar -->
    <div class="bg-white border-bottom">
        <div class="progress exam-progress">
            <div class="progress-bar bg-success"
                 th:style="'width:' + ${totalQuestions > 0 ? (answeredCount * 100 / totalQuestions) : 0} + '%'">
            </div>
        </div>
    </div>

    <!-- Main Exam Form -->
    <form th:action="@{/student/exam/{id}(id=${examId})}" method="post" id="examForm" class="flex-grow-1">
        <input type="hidden" name="currentPage" th:value="${currentPage}">

        <div class="container-xl py-4">
            <div class="row g-4">

                <!-- Questions Column -->
                <div class="col-lg-8">

                    <!-- Page info -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-muted small fw-semibold">
                            Page <span th:text="${currentPage}">1</span> of <span th:text="${totalPages}">1</span>
                        </span>
                        <span class="text-muted small">
                            Q <strong th:text="${(currentPage - 1) * questionsPerPage + 1}">1</strong>
                            &ndash;
                            <strong th:text="${currentPage * questionsPerPage < totalQuestions ? currentPage * questionsPerPage : totalQuestions}">10</strong>
                            of <strong th:text="${totalQuestions}">0</strong>
                        </span>
                    </div>

                    <!-- Question Cards -->
                    <div th:each="q : ${questions}" class="card border-0 shadow-sm mb-4 question-card">
                        <div class="card-body p-4">

                            <!-- Question number + text -->
                            <div class="d-flex align-items-start gap-3 mb-4">
                                <span class="badge bg-primary rounded-pill px-3 py-2 flex-shrink-0"
                                      th:text="${q.number}">1</span>
                                <span class="question-text" th:text="${q.question}">Question text</span>
                            </div>

                            <div th:with="answerKey=${'answer_' + q.number}, selectedAnswer=${answers[q.number]}">

                                <!-- Options: 4 per row on lg+, 2 per row on md, 1 per row on mobile -->
                                <div class="row g-3">

                                    <div class="col-lg-3 col-md-6">
                                        <label class="option-card"
                                               th:for="${'opt1_' + q.number}"
                                               th:classappend="${selectedAnswer != null && selectedAnswer == q.option1} ? ' selected' : ''">
                                            <input class="d-none" type="radio"
                                                   th:id="${'opt1_' + q.number}"
                                                   th:name="${answerKey}"
                                                   th:value="${q.option1}"
                                                   th:checked="${selectedAnswer != null && selectedAnswer == q.option1}">
                                            <div class="option-card-inner">
                                                <span class="option-badge">A</span>
                                                <span th:text="${q.option1}">Option 1</span>
                                            </div>
                                        </label>
                                    </div>

                                    <div class="col-lg-3 col-md-6">
                                        <label class="option-card"
                                               th:for="${'opt2_' + q.number}"
                                               th:classappend="${selectedAnswer != null && selectedAnswer == q.option2} ? ' selected' : ''">
                                            <input class="d-none" type="radio"
                                                   th:id="${'opt2_' + q.number}"
                                                   th:name="${answerKey}"
                                                   th:value="${q.option2}"
                                                   th:checked="${selectedAnswer != null && selectedAnswer == q.option2}">
                                            <div class="option-card-inner">
                                                <span class="option-badge">B</span>
                                                <span th:text="${q.option2}">Option 2</span>
                                            </div>
                                        </label>
                                    </div>

                                    <div class="col-lg-3 col-md-6">
                                        <label class="option-card"
                                               th:for="${'opt3_' + q.number}"
                                               th:classappend="${selectedAnswer != null && selectedAnswer == q.option3} ? ' selected' : ''">
                                            <input class="d-none" type="radio"
                                                   th:id="${'opt3_' + q.number}"
                                                   th:name="${answerKey}"
                                                   th:value="${q.option3}"
                                                   th:checked="${selectedAnswer != null && selectedAnswer == q.option3}">
                                            <div class="option-card-inner">
                                                <span class="option-badge">C</span>
                                                <span th:text="${q.option3}">Option 3</span>
                                            </div>
                                        </label>
                                    </div>

                                    <div class="col-lg-3 col-md-6">
                                        <label class="option-card"
                                               th:for="${'opt4_' + q.number}"
                                               th:classappend="${selectedAnswer != null && selectedAnswer == q.option4} ? ' selected' : ''">
                                            <input class="d-none" type="radio"
                                                   th:id="${'opt4_' + q.number}"
                                                   th:name="${answerKey}"
                                                   th:value="${q.option4}"
                                                   th:checked="${selectedAnswer != null && selectedAnswer == q.option4}">
                                            <div class="option-card-inner">
                                                <span class="option-badge">D</span>
                                                <span th:text="${q.option4}">Option 4</span>
                                            </div>
                                        </label>
                                    </div>

                                </div>

                                <!-- Clear selection -->
                                <div class="mt-3 d-flex justify-content-end">
                                    <button type="button"
                                            class="btn btn-link btn-sm text-muted p-0 clear-answer-btn"
                                            th:data-qnum="${q.number}">
                                        <i class="bi bi-x-circle me-1"></i>Clear Selection
                                    </button>
                                </div>

                            </div>
                        </div>
                    </div>

                    <!-- Navigation -->
                    <div class="card border-0 shadow-sm">
                        <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2 p-3">
                            <button type="submit" name="action" value="prev"
                                    class="btn btn-outline-secondary"
                                    th:disabled="${currentPage == 1}">
                                <i class="bi bi-chevron-left me-1"></i>Previous
                            </button>

                            <div class="d-flex flex-wrap gap-1">
                                <button th:each="p : ${#numbers.sequence(1, totalPages)}"
                                        type="submit" name="action"
                                        th:value="'page-' + ${p}"
                                        th:class="${p == currentPage} ? 'btn btn-primary btn-sm' : 'btn btn-outline-primary btn-sm'"
                                        th:text="${p}">1</button>
                            </div>

                            <div class="d-flex gap-2">
                                <button th:if="${currentPage < totalPages}"
                                        type="submit" name="action" value="next"
                                        class="btn btn-primary">
                                    Next<i class="bi bi-chevron-right ms-1"></i>
                                </button>
                                <button type="button" class="btn btn-success"
                                        onclick="showSubmitModal()">
                                    <i class="bi bi-check-circle me-1"></i>Submit Exam
                                </button>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Palette Column -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm sticky-top" style="top:16px;">
                        <div class="card-header bg-white border-bottom py-3 px-4">
                            <span class="fw-semibold">Question Palette</span>
                        </div>
                        <div class="card-body p-4">
                            <div class="d-flex flex-wrap gap-2 mb-3">
                                <button th:each="qn : ${allNumbers}"
                                        type="submit"
                                        name="action"
                                        th:id="'palette-q' + ${qn}"
                                        th:value="'page-' + ${(qn - 1) / questionsPerPage + 1}"
                                        th:class="${currentPage == (qn - 1) / questionsPerPage + 1}
                                                   ? 'btn btn-primary palette-btn'
                                                   : (answers[qn] != null
                                                      ? 'btn btn-success palette-btn'
                                                      : 'btn btn-outline-secondary palette-btn')"
                                        th:text="${qn}">1</button>
                            </div>
                            <div class="d-flex gap-2 flex-wrap">
                                <span class="badge bg-success py-2 px-3">Answered</span>
                                <span class="badge bg-light text-dark border py-2 px-3">Not Answered</span>
                                <span class="badge bg-primary py-2 px-3">Current Page</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </form>

    <!-- Submit Modal -->
    <div class="modal fade" id="submitModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow-lg">
                <div class="modal-header border-0 pb-0 pt-4 px-4">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-question-circle text-warning me-2"></i>Submit Exam?
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body px-4">
                    <p class="mb-1">You have answered
                        <strong class="text-success" th:text="${answeredCount}">0</strong>
                        out of
                        <strong th:text="${totalQuestions}">0</strong> questions.
                    </p>
                    <p th:if="${answeredCount < totalQuestions}" class="text-warning small mb-0">
                        <i class="bi bi-exclamation-triangle me-1"></i>
                        <span th:text="${totalQuestions - answeredCount}">0</span> question(s) unanswered.
                    </p>
                    <p class="text-muted small mt-2 mb-0">This action cannot be undone.</p>
                </div>
                <div class="modal-footer border-0 pt-0 pb-4 px-4">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x me-1"></i>Continue
                    </button>
                    <button type="button" class="btn btn-success px-4" onclick="submitExam()">
                        <i class="bi bi-check-circle me-1"></i>Yes, Submit
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
    <script th:inline="javascript">
        const csrfToken  = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
        const examId     = /*[[${examId}]]*/ '';
        const totalQuestionsCount = /*[[${totalQuestions}]]*/ 0;

        const answeredQuestions = new Set(/*[[${answeredList}]]*/ []);

        // Auto-save on radio change
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function () {
                const qNum   = parseInt(this.name.substring(7), 10);
                const answer = this.value;

                fetch('/student/exam/' + examId + '/save-answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded', [csrfHeader]: csrfToken },
                    body: 'questionNumber=' + qNum + '&answer=' + encodeURIComponent(answer)
                }).then(r => r.json()).then(data => {
                    if (data.status === 'saved') {
                        answeredQuestions.add(qNum);
                        markPaletteAnswered(qNum);
                        updateAnsweredCount();
                        highlightSelected(this);
                    }
                });
            });
        });

        // Clear selection
        document.querySelectorAll('.clear-answer-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const qNum = parseInt(this.dataset.qnum, 10);
                const name = 'answer_' + qNum;

                document.querySelectorAll('input[name="' + name + '"]').forEach(r => {
                    r.checked = false;
                    r.closest('label').classList.remove('selected');
                });

                fetch('/student/exam/' + examId + '/clear-answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded', [csrfHeader]: csrfToken },
                    body: 'questionNumber=' + qNum
                }).then(r => r.json()).then(data => {
                    if (data.status === 'cleared') {
                        answeredQuestions.delete(qNum);
                        markPaletteUnanswered(qNum);
                        updateAnsweredCount();
                    }
                });
            });
        });

        function markPaletteAnswered(qNum) {
            const btn = document.getElementById('palette-q' + qNum);
            if (!btn) return;
            btn.classList.remove('btn-outline-secondary', 'btn-primary');
            btn.classList.add('btn-success');
        }

        function markPaletteUnanswered(qNum) {
            const btn = document.getElementById('palette-q' + qNum);
            if (!btn) return;
            btn.classList.remove('btn-success', 'btn-primary');
            btn.classList.add('btn-outline-secondary');
        }

        function updateAnsweredCount() {
            const el = document.getElementById('answeredCountDisplay');
            if (el) el.textContent = answeredQuestions.size;
        }

        function highlightSelected(radio) {
            const name = radio.name;
            document.querySelectorAll('input[name="' + name + '"]').forEach(r => {
                r.closest('label').classList.toggle('selected', r === radio);
            });
        }

        // Highlight pre-selected options on page load
        document.querySelectorAll('input[type="radio"]:checked').forEach(r => highlightSelected(r));

        function showSubmitModal() {
            new bootstrap.Modal(document.getElementById('submitModal')).show();
        }

        function submitExam() {
            const form = document.getElementById('examForm');
            form.querySelectorAll('input[type="hidden"][name="action"]').forEach(el => el.remove());
            const input = document.createElement('input');
            input.type  = 'hidden';
            input.name  = 'action';
            input.value = 'submit';
            form.appendChild(input);
            form.submit();
        }

        // Timer
        const timerEnabled = /*[[${timerEnabled}]]*/ false;
        let remaining = /*[[${remainingSeconds}]]*/ 0;

        if (timerEnabled) {
            let autoSubmitted = false;

            function updateTimer() {
                if (remaining <= 0) {
                    document.getElementById('timerText').textContent = '00:00';
                    if (!autoSubmitted) {
                        autoSubmitted = true;
                        submitExam();
                    }
                    return;
                }
                const m = Math.floor(remaining / 60).toString().padStart(2, '0');
                const s = (remaining % 60).toString().padStart(2, '0');
                document.getElementById('timerText').textContent = m + ':' + s;
                if (remaining <= 60) {
                    document.getElementById('timerDisplay').classList.replace('bg-warning', 'bg-danger');
                    document.getElementById('timerDisplay').classList.remove('text-dark');
                    document.getElementById('timerDisplay').classList.add('text-white');
                }
                remaining--;
            }

            updateTimer();
            setInterval(updateTimer, 1000);
        }
    </script>
</body>
</html>
