<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Exams - School Assessment Platform</title>
    <link th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/student/dashboard}">
                <i class="bi bi-mortarboard-fill me-2"></i>School Assessment Platform
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white small">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="${username}">student</span>
                    <span class="badge bg-info text-dark ms-1">Student</span>
                </span>
                <form th:action="@{/logout}" method="post" class="mb-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="bg-white border-bottom py-3">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item">
                        <a th:href="@{/student/dashboard}" class="text-decoration-none">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item active">Available Exams</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="container py-4 flex-grow-1">

        <h4 class="fw-bold text-primary mb-4">
            <i class="bi bi-journal-text me-2"></i>Available Exams
        </h4>

        <div th:if="${exams.isEmpty()}" class="card border-0 shadow-sm">
            <div class="card-body text-center py-5">
                <i class="bi bi-inbox text-muted" style="font-size:3rem;"></i>
                <h5 class="mt-3 text-muted">No exams available</h5>
                <p class="text-muted small">Please check back later when your teacher has uploaded an exam.</p>
            </div>
        </div>

        <div class="row g-4" th:unless="${exams.isEmpty()}">
            <div class="col-md-6 col-lg-4" th:each="exam : ${exams}">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-header bg-primary text-white py-3">
                        <h6 class="mb-0 fw-bold" th:text="${exam.title}">Exam Title</h6>
                    </div>
                    <div class="card-body">
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <div class="text-muted small">Subject</div>
                                <div class="fw-semibold" th:text="${exam.subject}">Subject</div>
                            </div>
                            <div class="col-6">
                                <div class="text-muted small">Class</div>
                                <div class="fw-semibold" th:text="${exam.studentClass}">Class</div>
                            </div>
                            <div class="col-6">
                                <div class="text-muted small">Questions</div>
                                <div class="fw-semibold">
                                    <i class="bi bi-list-ol text-primary me-1"></i>
                                    <span th:text="${exam.questionCount}">0</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="text-muted small">Timer</div>
                                <div>
                                    <span th:if="${exam.timerEnabled}" class="badge bg-warning text-dark">
                                        <i class="bi bi-stopwatch me-1"></i>
                                        <span th:text="${exam.duration} + ' min'">60 min</span>
                                    </span>
                                    <span th:unless="${exam.timerEnabled}" class="badge bg-secondary">
                                        No Timer
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-top-0 pb-3 px-3">
                        <a th:href="@{/student/exam/{id}/start(id=${exam.examId})}"
                           class="btn btn-primary w-100">
                            <i class="bi bi-play-fill me-2"></i>Start Exam
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container text-center text-muted small">
            &copy; 2026 School Assessment Platform
        </div>
    </footer>

    <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
