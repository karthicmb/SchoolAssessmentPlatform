<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - School Assessment Platform</title>
    <link th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
                <i class="bi bi-mortarboard-fill me-2"></i>School Assessment Platform
            </a>
        </div>
    </nav>

    <div class="container-lg py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">

                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:4rem;"></i>

                <h1 class="display-1 fw-bold text-danger mt-3"
                    th:text="${statusCode} ?: '500'">500</h1>
                <h4 class="fw-semibold mb-3"
                    th:text="${statusText} ?: 'Something Went Wrong'">Something Went Wrong</h4>

                <p class="text-muted mb-4"
                   th:text="${message} ?: 'An unexpected error occurred. Please try again.'">
                    An unexpected error occurred. Please try again.
                </p>

                <div class="d-flex gap-3 justify-content-center">
                    <a href="javascript:history.back()" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Go Back
                    </a>
                    <a th:href="@{/dashboard}" class="btn btn-primary">
                        <i class="bi bi-house me-2"></i>Dashboard
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
